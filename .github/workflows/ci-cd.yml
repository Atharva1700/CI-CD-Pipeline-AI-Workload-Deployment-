name: CI/CD Pipeline - AI Application

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/ai-app

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt
          pip install pytest pytest-cov
      - name: Run unit tests
        run: pytest tests/ -v --cov=app --cov-report=term-missing
      - name: Check coverage
        run: coverage report --fail-under=80

  regression-test:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt
      - name: Run regression tests
        env:
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
        run: pytest tests/test_regression.py -v

  build:
    needs: [test, regression-test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      - name: Log in to Container Registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix={{branch}}-
            type=ref,event=branch
      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: .docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - uses: actions/checkout@v4
      - name: Configure kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > $HOME/.kube/config
      - name: Update image in deployment
        run: |
          IMAGE_TAG=$(echo "${{ needs.build.outputs.image-tag }}" | head -1)
          kubectl set image deployment/ai-app ai-app=$IMAGE_TAG -n production --record
      - name: Wait for rollout
        timeout-minutes: 5
        run: kubectl rollout status deployment/ai-app -n production --timeout=5m

  health-check:
    needs: deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Wait for service ready
        timeout-minutes: 2
        run: |
          for i in {1..30}; do
            echo "Health check attempt $i..."
            if kubectl get endpoints ai-app -n production 2>/dev/null | grep -q .; then
              echo "Service ready"
              break
            fi
            sleep 10
          done
      - name: Run health checks
        timeout-minutes: 3
        run: |
          SERVICE_IP=$(kubectl get svc ai-app -n production -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
          for i in {1..5}; do
            echo "Health check $i/5..."
            if curl -f -s http://$SERVICE_IP:8000/health; then
              echo "Health check passed"
              exit 0
            fi
            sleep 30
          done
          echo "Health check failed"
          exit 1
      - name: Rollback on Failure
        if: failure()
        run: |
          echo "Rolling back..."
          kubectl rollout undo deployment/ai-app -n production
          kubectl rollout status deployment/ai-app -n production --timeout=5m
